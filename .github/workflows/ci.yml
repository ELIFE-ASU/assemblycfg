name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test ".[plot]"

      - name: Run tests
        run: python -m pytest

      - name: Smoke-test plotting extra
        run: python -c 'import matplotlib.pyplot'

  package:
    name: Validate distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group release --group test

      - name: Build distributions
        run: python -m build

      - name: Validate metadata and contents
        run: |
          python -m twine check --strict dist/*
          python scripts/check_dist.py

      - name: Smoke-test the wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          cd "$RUNNER_TEMP"
          python -c 'import assemblycfg; from importlib.metadata import version; assert assemblycfg.__version__ == version("assemblycfg")'
          python -m pytest -q --import-mode=importlib --rootdir="$RUNNER_TEMP" "$GITHUB_WORKSPACE/tests"
