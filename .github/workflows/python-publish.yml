name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group release --group test .

      - name: Run tests
        run: python -m pytest

      - name: Build release distributions
        run: python -m build

      - name: Validate release distributions
        run: |
          python -m twine check --strict dist/*
          python scripts/check_dist.py --tag "$GITHUB_REF_NAME"

      - name: Smoke-test the wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          cd "$RUNNER_TEMP"
          python -c 'import assemblycfg; from importlib.metadata import version; assert assemblycfg.__version__ == version("assemblycfg")'
          python -m pytest -q --import-mode=importlib --rootdir="$RUNNER_TEMP" "$GITHUB_WORKSPACE/tests"

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi
      url: https://pypi.org/p/assemblycfg

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
