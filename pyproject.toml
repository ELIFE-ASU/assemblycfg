[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "assemblycfg"
dynamic = ["version"]
description = "Place upper bounds on assembly index using the grammar algorithm RePair."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "assembly theory",
    "context-free grammar",
    "molecular assembly",
    "RePair",
]

authors = [
    { name = "Gage Siebert" },
    { name = "Redwan Chowdhury" },
    { name = "Louie Slocombe" },
    { name = "Sara I. Walker" },
]

dependencies = [
    "networkx>=3.4.2",
    "rdkit>=2024.03.5",
]

classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.9.2",
]
dev = [
    "build>=1.2",
    "matplotlib>=3.9.2",
    "pytest>=8.4.2",
    "twine>=6",
]

[dependency-groups]
test = [
    "pytest>=8.4.2",
]
release = [
    "build>=1.2",
    "twine>=6",
]
dev = [
    { include-group = "test" },
    { include-group = "release" },
    "matplotlib>=3.9.2",
]

[project.urls]
Homepage = "https://github.com/ELIFE-ASU/assemblycfg"
Repository = "https://github.com/ELIFE-ASU/assemblycfg"
Issues = "https://github.com/ELIFE-ASU/assemblycfg/issues"
DOI = "https://doi.org/10.5281/zenodo.20562899"

[tool.setuptools.dynamic]
version = { attr = "assemblycfg._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["assemblycfg", "assemblycfg.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
